publiccodeYmlVersion: "0"

name: tugpgp
url: "https://github.com/SUNET/tugpgp"
platforms:
  - desktop

categories:
  - it-security

usedBy:
  - Sunet

developmentStatus: stable

softwareType: "standalone/desktop"

description:
  en:
    shortDescription: >
          An utility to create and upload OpenPGP keys to Yubikey.

    longDescription: >
        An utility to create and upload OpenPGP keys to Yubikey hardware
        tokens. The tool generates the key material on the host, provisions
        it onto the Yubikey, and never writes the private key to disk
        unless specifically asked.
    features:
      - OpenPGP key generation
      - Upload to Yubikey

